# LoROM / FastROM 256KB (32KB バンク x 8)
MEMORY {
    ZP:    start = $000000, size = $0100, type = rw, file = "";
    RAM:   start = $000200, size = $1D00, type = rw, file = "";
    ROM0:  start = $808000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM1:  start = $818000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM2:  start = $828000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM3:  start = $838000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMX:  start = $848000, size = $20000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    HEADER:   load = ROM0, type = ro, start = $80FFC0;
    VECTORS:  load = ROM0, type = ro, start = $80FFE0;
    BANK1:    load = ROM1, type = ro;
    BANK2:    load = ROM2, type = ro;
    BANK3:    load = ROM3, type = ro;
}
