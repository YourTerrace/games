name: Build SecurityCam APK

on:
  push:
    paths:
      - "securitycam/**"
      - ".github/workflows/build-securitycam.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securitycam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: securitycam-debug-apk
          path: securitycam/app/build/outputs/apk/debug/app-debug.apk
